<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jocul X și 0 (Tic-Tac-Toe)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-decorations">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <canvas id="confetti-canvas"></canvas>

    <main class="game-container">
        <header class="game-header">
            <h1 class="game-title">
                <span class="x-letter">X</span> și <span class="o-letter">0</span>
            </h1>
            <p class="game-subtitle">Clasicul joc de strategie</p>
        </header>

        <!-- Mod de joc -->
        <section class="mode-selector-wrapper">
            <label for="game-mode-select" class="visually-hidden">Alege modul de joc</label>
            <div class="mode-selector">
                <button type="button" class="mode-btn active" data-mode="pvp">
                    👥 2 Jucători
                </button>
                <button type="button" class="mode-btn" data-mode="ai-easy">
                    🤖 AI Ușor
                </button>
                <button type="button" class="mode-btn" data-mode="ai-hard">
                    🧠 AI Imbatabil
                </button>
            </div>
        </section>

        <!-- Tabela de scor -->
        <section class="scoreboard">
            <div class="score-card x-card" id="card-x">
                <span class="score-label">Jucător X</span>
                <span class="score-value" id="score-x">0</span>
            </div>
            <div class="score-card tie-card">
                <span class="score-label">Egalități</span>
                <span class="score-value" id="score-tie">0</span>
            </div>
            <div class="score-card o-card" id="card-o">
                <span class="score-label" id="label-o">Jucător 0</span>
                <span class="score-value" id="score-o">0</span>
            </div>
        </section>

        <!-- Indicator de rând / stare joc -->
        <section class="status-panel">
            <div class="status-message" id="status-message" aria-live="polite">
                Rândul lui <span class="current-turn x-turn">X</span>
            </div>
        </section>

        <!-- Tabla de joc (Grid 3x3) -->
        <section class="board-wrapper">
            <div class="board" id="board" role="grid" aria-label="Tabla de joc X și 0">
                <button class="cell" data-index="0" role="gridcell" aria-label="Căsuța 1"></button>
                <button class="cell" data-index="1" role="gridcell" aria-label="Căsuța 2"></button>
                <button class="cell" data-index="2" role="gridcell" aria-label="Căsuța 3"></button>
                <button class="cell" data-index="3" role="gridcell" aria-label="Căsuța 4"></button>
                <button class="cell" data-index="4" role="gridcell" aria-label="Căsuța 5"></button>
                <button class="cell" data-index="5" role="gridcell" aria-label="Căsuța 6"></button>
                <button class="cell" data-index="6" role="gridcell" aria-label="Căsuța 7"></button>
                <button class="cell" data-index="7" role="gridcell" aria-label="Căsuța 8"></button>
                <button class="cell" data-index="8" role="gridcell" aria-label="Căsuța 9"></button>
            </div>
        </section>

        <!-- Butoane de control -->
        <footer class="controls">
            <button id="btn-restart" class="btn btn-primary">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
                    <path d="M21 3v5h-5"/>
                    <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
                    <path d="M8 16H3v5"/>
                </svg>
                Rundă Nouă
            </button>
            <button id="btn-reset-score" class="btn btn-secondary">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 6h18"/>
                    <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
                    <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
                </svg>
                Resetează Scor
            </button>
            <button id="btn-sound-toggle" class="btn btn-icon" title="Comută Sunetul" aria-label="Comută Sunetul">
                <span id="sound-icon">🔊</span>
            </button>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
